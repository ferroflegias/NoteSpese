name: Build Android APK

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "ExpenseReport/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ExpenseReport
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::Secret RELEASE_KEYSTORE_BASE64 mancante: l'APK sarebbe prodotto non firmato e non installabile."
            exit 1
          fi
          # Ignora spazi e a capo eventualmente introdotti copiando il valore
          if ! printf '%s' "$RELEASE_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/release.keystore"; then
            echo "::error::Il secret RELEASE_KEYSTORE_BASE64 non contiene un base64 valido. Rigeneralo con 'base64 -w0 release.keystore' (Linux), 'base64 -i release.keystore' (macOS) o '[Convert]::ToBase64String([IO.File]::ReadAllBytes(\"release.keystore\"))' (PowerShell)."
            exit 1
          fi

      - name: Verify signing keystore
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          if ! keytool -list -keystore "$RUNNER_TEMP/release.keystore" -storepass "$RELEASE_STORE_PASSWORD" -alias "$RELEASE_KEY_ALIAS" > /dev/null; then
            echo "::error::Keystore non leggibile: controlla che RELEASE_KEYSTORE_BASE64 sia il keystore corretto e che RELEASE_STORE_PASSWORD e RELEASE_KEY_ALIAS siano giusti."
            exit 1
          fi

      - name: Check Dropbox App key
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY || vars.DROPBOX_APP_KEY }}
        run: |
          if [ -z "$DROPBOX_APP_KEY" ]; then
            echo "::warning::DROPBOX_APP_KEY non impostata (Settings > Secrets and variables > Actions): l'APK funzionerà ma non potrà collegarsi a Dropbox."
          fi

      - name: Build release APK and run unit tests
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY || vars.DROPBOX_APP_KEY }}
          RELEASE_STORE_FILE: ${{ runner.temp }}/release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testReleaseUnitTest assembleRelease

      - name: Verify APK signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PerExpenseReport-release
          path: ExpenseReport/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
