name: Keep Streamlit App Alive

on:
  schedule:
    # Esegue il job ogni 6 ore (alle ore 00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Aggiunge un pulsante per avviare l'azione manualmente da GitHub

jobs:
  ping-app:
    runs-on: ubuntu-latest
    steps:
      - name: Invia chiamata HTTP all'app Streamlit
        run: |
          curl -s -o /dev/null -w "%{http_code}" https://expensepereport.streamlit.app/
