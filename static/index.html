<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Note Spese 2026</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0d6efd">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body { background-color: #f8f9fa; padding-bottom: 30px; }
        .card { border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    </style>
</head>
<body>
    <div class="container py-3">
        <h3 class="text-center mb-3">🧾 Note Spese 2026</h3>

        <ul class="nav nav-pills nav-justified mb-3" id="pwaTabs" role="tablist">
            <li class="nav-item"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#tab-new">➕ Nuova</button></li>
            <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab-list" onclick="loadSpese()">📑 Registri</button></li>
            <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab-export">📁 Export</button></li>
        </ul>

        <div class="tab-content">
            <!-- TAB 1: NUOVA SPESA -->
            <div class="tab-pane fade show active" id="tab-new">
                <div id="alert-box"></div>
                <div class="card p-3">
                    <form id="form-spesa">
                        <div class="mb-3">
                            <label class="form-label">📷 Allegato (Foto o PDF)</label>
                            <input type="file" id="file" class="form-control" accept="image/*,application/pdf">
                            <button type="button" class="btn btn-outline-secondary btn-sm w-100 mt-2" onclick="runOCR()">🔍 Estrai Dati con OCR</button>
                        </div>
                        <div class="row">
                            <div class="col-6 mb-3">
                                <label class="form-label">Data</label>
                                <input type="date" id="data" class="form-control" required>
                            </div>
                            <div class="col-6 mb-3">
                                <label class="form-label">Importo (€)</label>
                                <input type="number" step="0.01" id="importo" class="form-control" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Esercente / Destinazione</label>
                            <input type="text" id="destinazione" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Categoria</label>
                            <select id="categoria" class="form-select">
                                <option value="RISTORANTI_CC">Bar / Ristorante (Carta)</option>
                                <option value="RISTORANTI_CONTANTI">Bar / Ristorante (Contanti)</option>
                                <option value="PARCHEGGI_CC">Parcheggio / Taxi (Carta)</option>
                                <option value="PARCHEGGI_CONTANTI">Parcheggio / Taxi (Contanti)</option>
                                <option value="CARBURANTE_CC">Carburante (Carta)</option>
                                <option value="CARBURANTE_CARTA">Carburante (Scheda)</option>
                                <option value="TELEPASS">Telepass</option>
                                <option value="NOLO">Nolo Auto</option>
                                <option value="ALTRO">Altro</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Note</label>
                            <textarea id="note" class="form-control" rows="2"></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2">💾 Salva Spesa</button>
                    </form>
                </div>
            </div>

            <!-- TAB 2: ARCHIVIO / ELIMINA -->
            <div class="tab-pane fade" id="tab-list">
                <div class="card p-3">
                    <h5>Archivio Spese</h5>
                    <div id="spese-container" class="list-group list-group-flush"></div>
                </div>
            </div>

            <!-- TAB 3: EXPORT -->
            <div class="tab-pane fade" id="tab-export">
                <div class="card p-3">
                    <h5>Esportazione Documenti</h5>
                    <div class="mb-3">
                        <label class="form-label">Mese per PDF Allegati</label>
                        <select id="exp-mese" class="form-select">
                            <option value="1">Gennaio</option><option value="2">Febbraio</option><option value="3">Marzo</option>
                            <option value="4">Aprile</option><option value="5">Maggio</option><option value="6">Giugno</option>
                            <option value="7">Luglio</option><option value="8">Agosto</option><option value="9">Settembre</option>
                            <option value="10">Ottobre</option><option value="11">Novembre</option><option value="12">Dicembre</option>
                        </select>
                    </div>
                    <button onclick="downloadPDF()" class="btn btn-danger w-100 mb-2">📄 Scarica PDF Allegati</button>
                    <button onclick="downloadExcel()" class="btn btn-success w-100">📊 Scarica Excel Note Spese</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('data').valueAsDate = new Date();
        if ('serviceWorker' in navigator) { navigator.serviceWorker.register('/sw.js'); }

        async function runOCR() {
            const fileInput = document.getElementById('file');
            if (!fileInput.files[0]) return alert('Carica prima un file!');
            const fd = new FormData();
            fd.append('file', fileInput.files[0]);
            const res = await fetch('/api/ocr', { method: 'POST', body: fd });
            if (res.ok) {
                const d = await res.json();
                if (d.data) document.getElementById('data').value = d.data;
                if (d.importo) document.getElementById('importo').value = d.importo;
                if (d.destinazione) document.getElementById('destinazione').value = d.destinazione;
                if (d.note) document.getElementById('note').value = d.note;
            }
        }

        document.getElementById('form-spesa').addEventListener('submit', async (e) => {
            e.preventDefault();
            const fd = new FormData();
            fd.append('data', document.getElementById('data').value);
            fd.append('importo', document.getElementById('importo').value);
            fd.append('destinazione', document.getElementById('destinazione').value);
            fd.append('categoria', document.getElementById('categoria').value);
            fd.append('note', document.getElementById('note').value);
            const fileInput = document.getElementById('file');
            if (fileInput.files[0]) fd.append('file', fileInput.files[0]);

            const res = await fetch('/api/spese', { method: 'POST', body: fd });
            if (res.ok) {
                document.getElementById('alert-box').innerHTML = '<div class="alert alert-success">🎉 Spesa e allegato salvati con successo!</div>';
                document.getElementById('form-spesa').reset();
                document.getElementById('data').valueAsDate = new Date();
            }
        });

        async function loadSpese() {
            const res = await fetch('/api/spese');
            const data = await res.json();
            const container = document.getElementById('spese-container');
            container.innerHTML = '';
            data.forEach(s => {
                container.innerHTML += `
                    <div class="list-group-item d-flex justify-content-between align-items-center">
                        <div>
                            <strong>${s.destinazione || s.categoria}</strong> <br>
                            <small class="text-muted">${s.data} - € ${s.importo.toFixed(2)}</small>
                        </div>
                        <button onclick="deleteSpesa(${s.id})" class="btn btn-outline-danger btn-sm">🗑️</button>
                    </div>`;
            });
        }

        async function deleteSpesa(id) {
            if (confirm('Eliminare questo record?')) {
                await fetch(`/api/spese/${id}`, { method: 'DELETE' });
                loadSpese();
            }
        }

        function downloadPDF() {
            const m = document.getElementById('exp-mese').value;
            window.open(`/api/export/pdf?anno=2026&mese=${m}`, '_blank');
        }

        function downloadExcel() {
            window.open(`/api/export/excel?anno=2026&modo=anno`, '_blank');
        }
    </script>
</body>
</html>
